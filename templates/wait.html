<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ищем автомобили…</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5 text-center">
    <h3>Ищем объявления</h3>
    <p id="status">Запуск…</p>
    <script>
    const jobId = "{{ job_id }}";
    async function poll() {
        const r = await fetch("/api/search/jobs/" + jobId);
        const data = await r.json();
        document.getElementById("status").textContent = data.progress || data.status;
        if (data.status === "done" || data.status === "error") {
            const res = data.result || {};
            document.open();
            document.write("<pre>" + JSON.stringify(res, null, 2) + "</pre>");
            document.close();
            return;
        }
        setTimeout(poll, 1000);
    }
    poll();
    </script>
</body>
</html>
