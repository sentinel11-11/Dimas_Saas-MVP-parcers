<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сохранённые поиски</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h2>Сохранённые поиски (макс. 3 на email)</h2>
        <form class="row g-2 mb-4" method="get">
            <div class="col-auto">
                <input class="form-control" name="email" placeholder="email" value="{{ email }}">
            </div>
            <div class="col-auto">
                <button class="btn btn-primary">Показать</button>
            </div>
            <div class="col-auto">
                <a class="btn btn-link" href="/">На главную</a>
            </div>
        </form>
        <table class="table">
            <thead>
                <tr><th>ID</th><th>Марка</th><th>Модель</th><th>Мин. цена</th><th>Лотов</th><th></th></tr>
            </thead>
            <tbody>
            {% for s in searches %}
                <tr>
                    <td>{{ s.id }}</td>
                    <td>{{ s.brand }}</td>
                    <td>{{ s.model }}</td>
                    <td>{{ s.last_min_price }}</td>
                    <td>{{ s.last_count }}</td>
                    <td class="d-flex gap-1">
                        <form method="post" action="/searches/{{ s.id }}/check">
                            <button class="btn btn-sm btn-success">Проверить дешевле</button>
                        </form>
                        <form method="post" action="/searches/{{ s.id }}/delete">
                            <input type="hidden" name="email" value="{{ email }}">
                            <button class="btn btn-sm btn-outline-danger">Удалить</button>
                        </form>
                    </td>
                </tr>
            {% else %}
                <tr><td colspan="6">Пока нет сохранённых поисков</td></tr>
            {% endfor %}
            </tbody>
        </table>
        <form action="/import/csv" method="post" enctype="multipart/form-data" class="mt-4">
            <label class="form-label">Импорт CSV (разделитель ;)</label>
            <input type="file" name="file" accept=".csv" class="form-control mb-2">
            <button class="btn btn-outline-secondary">Импортировать</button>
        </form>
    </div>
</body>
</html>
